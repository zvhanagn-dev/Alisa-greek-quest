<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alisa Greek practice</title><style>body{font:18px system-ui;background:#f5f6f8;color:#182333;max-width:720px;margin:30px auto;padding:16px}main{background:white;padding:24px;border-radius:14px}button,select{font:inherit;padding:12px;margin:5px;border:1px solid #abb5c2;border-radius:8px;background:white;color:inherit}#opts button{display:block;width:100%;text-align:left}button:disabled{opacity:.8}progress{width:100%}#feedback{min-height:48px}</style><main><h1>Greek practice · Αλίσα</h1><p>Choose a category / Выберите раздел</p><select id="cat"></select><button id="start">Start / Начать</button><p id="score"></p><progress id="bar" value="0" max="1"></progress><h2 id="prompt"></h2><div id="opts"></div><p id="feedback" aria-live="polite"></p><button id="next" hidden>Next / Далее</button><button id="retry" hidden>Retry mistakes / Повторить ошибки</button></main><script>const data=[["Pronunciation", "υιός", "son / сын", ["father"]], ["Pronunciation", "κοροϊδεύω", "separate ο + ι", ["one sound /i/"]], ["Pronunciation", "ρολόι", "separate ο + ι", ["one sound /i/"]], ["Pronunciation", "γαϊδούρι", "separate α + ι", ["one sound /e/"]], ["Genitive plural", "οι άνθρωποι → ?", "των ανθρώπων", ["οι άνθρωποι", "ο άνθρωπος"]], ["Genitive plural", "οι λύκοι → ?", "των λύκων", ["οι λύκοι", "ο λύκος"]], ["Genitive plural", "οι γιατροί → ?", "των γιατρών", ["οι γιατροί", "ο γιατρός"]], ["Genitive plural", "οι ελέφαντες → ?", "των ελεφάντων", ["οι ελέφαντες", "ο ελέφαντας"]], ["Genitive plural", "οι οικογένειες → ?", "των οικογενειών", ["οι οικογένειες", "η οικογένεια"]], ["Genitive plural", "οι εβδομάδες → ?", "των εβδομάδων", ["οι εβδομάδες", "η εβδομάδα"]], ["Genitive plural", "οι τιμές → ?", "των τιμών", ["οι τιμές", "η τιμή"]], ["Genitive plural", "οι θάλασσες → ?", "των θαλασσών", ["οι θάλασσες", "η θάλασσα"]], ["Genitive plural", "τα παιχνίδια → ?", "των π
