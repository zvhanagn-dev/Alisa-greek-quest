<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Alisa • Greek Practice</title><style>:root{font-family:system-ui,Arial,sans-serif;color:#243047;background:#f5f7fc}body{margin:0}main{max-width:850px;margin:auto;padding:24px 16px 60px}header{background:linear-gradient(110deg,#6557c9,#239ca8);color:white;padding:26px;border-radius:22px}h1{margin:0 0 7px}h2{font-size:1.3rem}.sub{opacity:.9}.panel{background:white;padding:22px;border-radius:18px;margin-top:20px;box-shadow:0 4px 20px #17234a12}.question{padding:15px 0;border-bottom:1px solid #e8ebf2}.question:last-child{border:0}.prompt{font-weight:600;margin-bottom:8px}input,select{font:inherit;padding:10px 12px;border:1px solid #bfc8d9;border-radius:9px;max-width:100%;box-sizing:border-box;background:white}input{width:280px}.feedback{font-size:.92rem;margin-top:6px;min-height:18px}.good{color:#087b52}.bad{color:#b53e48}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px}button{background:#5147ad;color:white;border:0;border-radius:10px;padding:11px 18px;font-weight:650;cursor:pointer}button.secondary{background:#e9e7fa;color:#433c8f}.small{color:#647087;font-size:.9rem}.score{font-size:1.15rem;font-weight:700;margin-top:12px}.pill{display:inline-block;padding:5px 9px;background:#eef1ff;color:#4a4597;border-radius:20px;font-size:.8rem;margin:5px 5px 0 0}footer{margin-top:24px;color:#667} @media(max-width:550px){header{padding:20px}main{padding:12px}.panel{padding:16px}input{width:100%}}</style></head><body><main><header><h1>🇬🇷 Alisa’s Greek Practice</h1><div class="sub">Review • Numbers • Nouns • έχω • και / ούτε</div><div>Practice at your own pace. Check your answers and try again!</div></header><div id="app"></div><footer>Tip: Greek accents are accepted but not required in typed answers. You can retry as many times as you like.</footer></main><script>
const sections=[
{title:'1. Numbers — Αριθμοί',hint:'Write the number in Greek words. / Напиши число словами по-гречески.',type:'text',items:[['200','διακόσια'],['400','τετρακόσια'],['600','εξακόσια'],['900','εννιακόσια'],['1,000','χίλια'],['2,000','δύο χιλιάδες'],['350','τριακόσια πενήντα'],['780','επτακόσια ογδόντα'],['1,500','χίλια πεντακόσια'],['2,400','δύο χιλιάδες τετρακόσια']]},
{title:'2. Nouns — Ονομαστική / Αιτιατική',hint:'Complete with the correct article and noun form. / Вставь артикль и правильную форму существительного.',type:'text',items:[['___ (ο φίλος) μου δουλεύει στη Λάρνακα.','ο φίλος'],['Βλέπω ___ (ο φίλος) μου στο πάρκο.','τον φίλο'],['___ (η γυναίκα) κάθεται στην καρέκλα.','η γυναίκα'],['Γνωρίζω ___ (η γυναίκα).','τη γυναίκα','την γυναίκα'],['___ (ο φοιτητής) διαβάζουν στο πανεπιστήμιο.','οι φοιτητές'],['Βλέπω ___ (ο φοιτητής) στη βιβλιοθήκη.','τους φοιτητές'],['___ (το παιδί) παίζουν στο πάρκο.','τα παιδιά'],['Βλέπω ___ (το παιδί).','τα παιδιά'],['___ (η φίλη) μου είναι χαρούμενες.','οι φίλες'],['Αγαπάω ___ (η φίλη) μου.','τις φίλες']]},
{title:'3. The verb έχω',hint:'Choose the correct form. / Выбери правильную форму глагола.',type:'choice',choices:['έχω','έχεις','έχει','έχουμε','έχετε','έχουν'],items:[['Εγώ ___ ένα βιβλίο.','έχω'],['Εσύ ___ χρόνο σήμερα;','έχεις'],['Η Αλίσα ___ μάθημα στο πανεπιστήμιο.','έχει'],['Εμείς ___ δύο φίλους στην Κύπρο.','έχουμε'],['Εσείς ___ καλό καιρό σήμερα;','έχετε'],['Οι φίλες μου ___ γενέθλια τον Αύγουστο.','έχουν'],['Εγώ δεν ___ αυτοκίνητο.','έχω'],['Ο φίλος μου ___ μια άνετη καρέκλα.','έχει']]},
{title:'4. Και / Ούτε',hint:'Choose και (also) or ούτε (neither/either). / Выбери και или ούτε.',type:'choice',choices:['και','ούτε'],items:[['Η Μαρία είναι χαρούμενη. ___ η Άννα είναι χαρούμενη.','και'],['Δεν έχω χρόνο σήμερα. ___ αύριο έχω χρόνο.','ούτε'],['Μου αρέσει η θάλασσα. ___ στη φίλη μου αρέσει.','και'],['Δεν ξέρω την απάντηση. ___ ο φίλος μου την ξέρει.','ούτε'],['Η καρέκλα μου είναι άνετη. ___ η δική σου είναι άνετη.','και'],['Δεν έχω μάθημα σήμερα. ___ αύριο έχω μάθημα.','ούτε']]},
{title:'5. Dates and weather',hint:'Choose the correct answer. / Выбери правильный ответ.',type:'mc',items:[['My birthday is on August 19.',['Έχω γενέθλια στις 19 Αυγούστου.','Έχω γενέθλιο στις 19 Αύγουστο.'],'Έχω γενέθλια στις 19 Αυγούστου.'],['I was born in 2005.',['Γεννήθηκα το 2005.','Γεννήθηκα τον 2005.'],'Γεννήθηκα το 2005.'],['It is hot.',['Έχει ζέστη.','Έχει κρύο.'],'Έχει ζέστη.'],['The weather is bad.',['Έχει καλό καιρό.','Έχει κακό καιρό.'],'Έχει κακό καιρό.'],['I swim in the sea.',['Κάνω μπάνιο στη θάλασσα.','Κάνω μπάνιο στο σπίτι.'],'Κάνω μπάνιο στη θάλασσα.']]}
];
const app=document.getElementById('app');function norm(s){return String(s||'').trim().toLocaleLowerCase('el').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/ς/g,'σ').replace(/\s+/g,' ')}
sections.forEach((sec,si)=>{let panel=document.createElement('section');panel.className='panel';let h=document.createElement('h2');h.textContent=sec.title;panel.append(h);let p=document.createElement('p');p.className='small';p.textContent=sec.hint;panel.append(p);sec.items.forEach((item,i)=>{let q=document.createElement('div');q.className='question';let label=document.createElement('div');label.className='prompt';label.textContent=(i+1)+'. '+item[0];q.append(label);let field;if(sec.type==='text'){field=document.createElement('input');field.placeholder='Type in Greek…';field.autocomplete='off';field.spellcheck=false}else{field=document.createElement('select');let choices=sec.type==='mc'?item[1]:sec.choices;let opt=document.createElement('option');opt.value='';opt.textContent='Choose an answer';field.append(opt);choices.forEach(c=>{let o=document.createElement('option');o.textContent=c;o.value=c;field.append(o)})}field.setAttribute('aria-label',item[0]);field.dataset.answers=JSON.stringify(sec.type==='text'?item.slice(1):[sec.type==='mc'?item[2]:item[1]]);q.append(field);let fb=document.createElement('div');fb.className='feedback';q.append(fb);panel.append(q)});let actions=document.createElement('div');actions.className='actions';let check=document.createElement('button');check.textContent='✓ Check answers';check.onclick=()=>{let correct=0;let fields=[...panel.querySelectorAll('input,select')];fields.forEach(f=>{let answers=JSON.parse(f.dataset.answers);let ok=answers.some(a=>norm(a)===norm(f.value));if(ok)correct++;let fb=f.nextElementSibling;fb.className='feedback '+(ok?'good':'bad');fb.textContent=ok?'✓ Correct!':'✗ Try again'+(f.value?'':' — enter an answer');});score.textContent=`Score: ${correct} / ${fields.length}`};let show=document.createElement('button');show.className='secondary';show.textContent='Show answers';show.onclick=()=>{panel.querySelectorAll('input,select').forEach(f=>{let answer=JSON.parse(f.dataset.answers)[0];let fb=f.nextElementSibling;fb.className='feedback small';fb.textContent='Answer: '+answer})};let reset=document.createElement('button');reset.className='secondary';reset.textContent='Try again';reset.onclick=()=>{panel.querySelectorAll('input,select').forEach(f=>{f.value='';f.nextElementSibling.textContent='' });score.textContent=''};let score=document.createElement('div');score.className='score';actions.append(check,show,reset);panel.append(actions,score);app.append(panel)});
</script></body></html>
