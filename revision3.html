ry"}];let items=[],i=0,selected=null,wrong=[],checked=false,score=0;const $=id=>document.getElementById(id);function shuffle(a){return [...a].sort(()=>Math.random()-.5)}function restart(){items=shuffle(bank.filter(x=>$('category').value==='all'||x.section===$('category').value));i=0;wrong=[];score=0;render()}function render(){selected=null;checked=false;$('summary').textContent='';if(i>=items.length){$('progress').textContent='Finished / Готово';$('question').textContent=`Score: ${score}/${items.length}`;$('choices').innerHTML='';$('feedback').textContent='Repeat mistakes or restart / Повторите ошибки или начните заново';return}let x=items[i];$('progress').textContent=`Question ${i+1} / ${items.length} • Correct: ${score}`;$('question').textContent=x.q;$('choices').innerHTML='';shuffle(x.options).forEach(o=>{let b=document.createElement('button');b.className='choice';b.textContent=o;b.onclick=()=>{if(checked)return;selected=o;document.querySelectorAll('.choice').forEach(z=>z.classList.toggle('selected',z===b))};$('choices').appendChild(b)});$('feedback').textContent=''}function check(){if(checked||!selected||i>=items.length)return;checked=true;let x=items[i],ok=selected===x.a;if(ok)score++;else wrong.push(x);document.querySelectorAll('.choice').forEach(b=>{if(b.textContent===x.a)b.classList.add('correct');else if(b.textContent===selected)b.classList.add('wrong')});$('feedback').textContent=ok?'✓ Correct! / Верно!':'✗ Correct answer / Правильный ответ: '+x.a}function next(){if(i>=items.length)return;if(!checked){$('feedback').textContent='Check your answer first / Сначала проверьте ответ';return}i++;render()}function repeatWrong(){if(!wrong.length){$('feedback').textContent='No mistakes yet / Пока нет ошибок';return}items=shuffle(wrong);wrong=[];i=0;score=0;render()}$('category').onchange=restart;restart();</script></html>
